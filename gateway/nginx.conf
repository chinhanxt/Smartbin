events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/x-javascript image/svg+xml font/woff font/woff2;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 3090;
        server_name localhost _;

        port_in_redirect off;
        absolute_redirect off;

        # Client real IP forwarding from Cloudflare
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        # Trailing slash redirects
        location = /appmobile { return 301 /appmobile/; }
        location = /core { return 301 /core/; }
        location = /citizen { return 301 /citizen/; }
        location = /billing { return 301 /billing/; }
        location = /hrm { return 301 /hrm/; }
        location = /bulky { return 301 /bulky/; }
        location = /dispatch { return 301 /dispatch/; }
        location = /trashcan { return 301 /trashcan/; }
        location = /presentation { return 301 /presentation/; }

        # Tab 1: Driver Mobile GPS Tracker (/appmobile/)
        location /appmobile/ {
            proxy_pass http://smartbin-mobile-tracker-app:80/appmobile/;
            proxy_http_version 1.1;
        }

        # Tab 6: Central Management & Telemetry Core (/core/)
        location /core/ {
            proxy_pass http://smartbin-web-app:80/core/;
            proxy_http_version 1.1;
        }

        # Tab 2: Citizen Service
        location /citizen/ {
            proxy_pass http://smartbin-citizen-microservice:80/;
            proxy_http_version 1.1;
        }

        # Tab 3: Admin & Billing
        location /billing/ {
            proxy_pass http://smartbin-admin-billing-microservice:80/;
            proxy_http_version 1.1;
        }

        # Tab 4: HRM Service
        location /hrm/ {
            proxy_pass http://smartbin-hrm-microservice:80/;
            proxy_http_version 1.1;
        }

        # Tab 5: Bulky Waste Service
        location /bulky/ {
            proxy_pass http://smartbin-bulky-microservice:80/;
            proxy_http_version 1.1;
        }

        # Tab 7: Dispatch Routing & AI Map
        location /dispatch/ {
            proxy_pass http://smartbin-dispatch-microservice:80/;
            proxy_http_version 1.1;
        }

        # Tab 8: 3D Smart Trashcan IoT Simulation
        location /trashcan/ {
            proxy_pass http://smart-trashcan-microservice:80/;
            proxy_http_version 1.1;
        }

        # Interactive Presentation Slides
        location /presentation/ {
            proxy_pass http://smartbin-presentation-app:80/;
            proxy_http_version 1.1;
        }

        # Traccar WebSocket Proxy
        location /api/socket {
            proxy_pass http://host.docker.internal:8082/api/socket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Traccar REST API Proxy
        location /api/ {
            proxy_pass http://host.docker.internal:8082/api/;
            proxy_http_version 1.1;
        }

        # Direct GPS OsmAnd Telemetry
        location /gps {
            proxy_pass http://host.docker.internal:5055/;
            proxy_http_version 1.1;
        }

        # Client IP Detection
        location = /client-ip {
            proxy_pass http://smartbin-mobile-tracker-app:80/client-ip;
        }

        # Intelligent Root Redirection
        location = / {
            if ($http_user_agent ~* "(android|bb\d+|meego).+mobile|avantgo|bada\/|blackberry|blazer|compal|elaine|fennec|hiptop|iemobile|ip(hone|od)|iris|kindle|lge |maemo|midp|mmp|mobile.+firefox|netfront|opera m(ob|in)i|palm( os)?|phone|p(ixi|re)\/|plucker|pocket|psp|series(4|6)0|symbian|treo|up\.(browser|link)|vodafone|wap|windows ce|xda|xiino") {
                return 302 /appmobile/;
            }
            return 302 /core/;
        }
    }
}
