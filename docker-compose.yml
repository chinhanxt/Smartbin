version: '3.8'

services:
  smartbin-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: smartbin-web:latest
    container_name: smartbin-web-app
    ports:
      - "3000:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
