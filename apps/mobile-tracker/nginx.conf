map $http_cf_connecting_ip $real_client_ip {
    "" $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        image/svg+xml
        font/woff
        font/woff2;

    # Microservice Headers
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;

    # Client IP Detection Endpoints
    location = /client-ip {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
        return 200 '{"ip":"$real_client_ip","deviceId":"$real_client_ip-01","deviceIndex":1}';
    }

    location = /appmobile/client-ip {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
        return 200 '{"ip":"$real_client_ip","deviceId":"$real_client_ip-01","deviceIndex":1}';
    }

    # Healthcheck Endpoint
    location /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Service Worker Unregister & Legacy Cache Purge
    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        return 200 "self.addEventListener('install', () => self.skipWaiting()); self.addEventListener('activate', () => { self.clients.matchAll().then(cs => cs.forEach(c => c.navigate(c.url))); caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k)))); self.registration.unregister(); });";
    }

    # Block legacy Traccar API calls from returning index.html
    location /api/ {
        default_type application/json;
        return 404 '{"error":"Not Found"}';
    }

    # GPS Telemetry Ingestion Proxies
    location /gps {
        proxy_pass http://host.docker.internal:5055/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /appmobile/gps {
        proxy_pass http://host.docker.internal:5055/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Subpath /appmobile/ support
    location ^~ /appmobile/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /usr/share/nginx/html/index.html;
    }

    # Cache Static Assets
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
