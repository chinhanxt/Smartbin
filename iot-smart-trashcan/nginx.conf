server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        image/svg+xml
        model/gltf-binary
        model/gltf+json;

    # Custom MIME Types for 3D GLTF / GLB models
    include /etc/nginx/mime.types;
    types {
        model/gltf-binary glb;
        model/gltf+json   gltf;
    }

    # Microservice Headers: Allow embedding in any parent website (Iframe & CORS)
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;
    add_header Content-Security-Policy "frame-ancestors *" always;

    # Healthcheck endpoint for Docker / K8s / Reverse Proxy
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Cache static 3D models and media assets
    location ~* \.(glb|gltf|bin|png|jpg|jpeg|svg|webp|woff2?|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Content-Security-Policy "frame-ancestors *" always;
        try_files $uri =404;
    }

    # Static JS & CSS
    location ~* \.(js|css)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Content-Security-Policy "frame-ancestors *" always;
        try_files $uri =404;
    }

    # Single Page Application fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
