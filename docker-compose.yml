version: '3.8'

services:
  smartbin-dispatch-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: smartbin-dispatch-service:latest
    container_name: smartbin-dispatch-microservice
    restart: unless-stopped
    ports:
      - "3007:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
