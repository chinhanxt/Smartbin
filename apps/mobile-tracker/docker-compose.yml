version: '3.8'

services:
  smartbin-mobile-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    image: smartbin-webapp:latest
    container_name: smartbin-webapp-service
    ports:
      - "3005:80"
      - "3001:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 3s
      retries: 3
